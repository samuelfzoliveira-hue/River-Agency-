services:
  - type: web
    name: river-agency
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: APROVACAO_STORAGE_DIR
        value: /var/data
      - key: APROVACAO_ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: river-agency-data
      mountPath: /var/data
      sizeGB: 1
